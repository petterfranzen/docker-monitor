# docker-monitor: watches every other container on this host, pushes an
# ntfy notification when one breaks, and — since it grew a control API —
# starts, stops and updates the Compose projects listed in its registry.
# See README.md for the full picture.
#
# This root file is the DEV shape: it builds from source and talks to the
# host's Docker socket directly, because on a dev machine you're iterating
# on the code and the socket is already right there. The NAS shape is
# deploy/docker-compose.yml, which pulls a prebuilt image and puts a
# socket proxy in front of the daemon — use that one for anything
# long-lived or internet-reachable.
#
# Note the socket is mounted read-WRITE here, unlike earlier versions of
# this file. Starting and stopping containers is a write operation; there
# is no way around that. What stops it from being a general-purpose
# remote-control hole is the API's own guest/owner split and the project
# registry — see README.md's "Security notes".
#
# Also bundles a self-hosted ntfy (https://ntfy.sh) server, since the human
# asked for self-hosted specifically — this is what NOTIFY_MODE=ntfy talks
# to by default (NTFY_URL=http://ntfy:80, the compose-internal hostname).
# Already run an ntfy server elsewhere on your NAS? Point NTFY_URL at that
# instead and delete/comment out the `ntfy` service below.
#
# Usage:
#   cp .env.example .env      # NOTIFY_MODE=console works with no changes
#   docker compose up -d --build
#   docker compose logs -f
#   curl localhost:8000/api/projects

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: docker-monitor-ntfy
    command: serve
    restart: unless-stopped
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "${NTFY_PORT:-8080}:80"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  docker-monitor:
    build: .
    container_name: docker-monitor
    restart: unless-stopped
    depends_on:
      - ntfy
    env_file:
      - .env
    ports:
      # The control API. Bound to localhost on a dev machine — there's no
      # reverse proxy in front of it here, and nothing on this port should
      # be reachable from the rest of the LAN by accident.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Read-write: the control API starts and stops containers. See the
      # header comment and README.md's "Security notes".
      - /var/run/docker.sock:/var/run/docker.sock
      # Leases must outlive the container, or a restart orphans whatever a
      # guest started — see docker_monitor/leases.py.
      - monitor-data:/data
      # The project registry, and the compose files it points at. Mounted
      # read-only: this process must never be able to rewrite the list of
      # what it's allowed to control.
      - ./projects.example.json:/config/projects.json:ro
      - ${STACKS_DIR:-./stacks}:/stacks:ro
    # Least-privilege hardening: nothing here needs a Linux capability.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ntfy-data:
  monitor-data:
