# NAS-facing compose file: pulls the prebuilt docker-monitor image from
# GHCR instead of building locally (see
# .github/workflows/docker-publish.yml for how that gets published).
#
# Self-contained on purpose, the same way flight-tracker's deploy/
# docker-compose.yml is: every setting is inlined below as
# ${VAR_NAME:-default} rather than read from a separate .env file, so
# pasting this one file into a GUI Docker app (Portainer/Container
# Manager/UGOS-style "Project" compose editors all do this) is enough —
# most of those UIs scan the pasted YAML for ${...} references and
# generate a fill-in form from them automatically, no file upload needed.
#
# Prefer a real .env file instead (terminal/`docker compose` use)? Drop
# one next to this file with any of the same names — docker compose reads
# it automatically and it overrides the :-defaults below with no changes
# needed here.
#
# THREE things differ from the repo-root (dev) compose file:
#
#  1. The image comes from GHCR instead of `build: .`.
#  2. A docker-socket-proxy sits between this and the real Docker socket;
#     docker-monitor never sees /var/run/docker.sock at all.
#  3. You must mount your stacks directory and a projects.json, or nothing
#     is controllable — see the `volumes` on docker-monitor below.
#
# Before exposing this to the internet, read the root README's "Security
# notes". The short version: the socket proxy is NOT the thing protecting
# you, the guest/owner split and the project registry are.

name: docker-monitor

services:
  # Everything the monitor does to Docker goes through here. Compare the
  # flags below with the full list at
  # https://github.com/Tecnativa/docker-socket-proxy — anything not
  # explicitly enabled is refused with a 403 by the proxy itself.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-monitor-socket-proxy
    restart: unless-stopped
    environment:
      # Read paths: what the alerting side needs (list/inspect/logs).
      CONTAINERS: 1
      # Write paths: what `docker compose up/stop/pull` needs.
      POST: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      # Compose calls these on startup to negotiate API version.
      PING: 1
      VERSION: 1
      INFO: 1
      # Explicitly OFF. EXEC is the important one — it's the difference
      # between "can manage containers" and "can run arbitrary commands
      # inside any of them, including ones holding secrets".
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Not published to the host: only other services on this compose
    # network should ever reach it.
    expose:
      - "2375"
    cap_drop:
      - ALL
    cap_add:
      # haproxy inside the proxy image binds a port and drops privileges.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: docker-monitor-ntfy
    command: serve
    restart: unless-stopped
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "${NTFY_PORT:-8080}:80"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  docker-monitor:
    image: ghcr.io/petterfranzen/docker-monitor:${IMAGE_TAG:-latest}
    container_name: docker-monitor
    restart: unless-stopped
    depends_on:
      - ntfy
      - socket-proxy
    ports:
      # The control API. Put a reverse proxy in front of this (the
      # portfolio's nginx proxies /lab-api/ to it) rather than exposing
      # the port to the internet directly — that's what makes
      # TRUST_PROXY_HEADERS below safe to turn on.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      # ---- notifications ------------------------------------------------
      # "console" logs what WOULD be pushed to stdout, no ntfy needed —
      # safe default, good for confirming this sees your containers before
      # switching to real pushes. "ntfy" actually sends via NTFY_URL/TOPIC.
      NOTIFY_MODE: ${NOTIFY_MODE:-console}
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
      # Required once NOTIFY_MODE=ntfy. Pick a hard-to-guess topic name —
      # ntfy topics are unauthenticated-readable by default (see root
      # README's "Security notes"), so treat it like a shared secret.
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      ALERT_ON_RECOVERY: ${ALERT_ON_RECOVERY:-true}

      # ---- talking to Docker ---------------------------------------------
      # The proxy, never the raw socket. Both docker-py and the bundled
      # `docker compose` CLI read this.
      DOCKER_HOST: ${DOCKER_HOST:-tcp://socket-proxy:2375}

      # ---- polling -------------------------------------------------------
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      # Used instead of the above while a project is mid-operation or
      # holding a lease, so a dashboard someone is watching a stack boot on
      # updates at a believable rate.
      ACTIVE_POLL_INTERVAL_SECONDS: ${ACTIVE_POLL_INTERVAL_SECONDS:-5}

      # ---- alerting ------------------------------------------------------
      RESTART_LOOP_THRESHOLD: ${RESTART_LOOP_THRESHOLD:-3}
      RESTART_LOOP_WINDOW_SECONDS: ${RESTART_LOOP_WINDOW_SECONDS:-300}
      CONTAINER_INCLUDE: ${CONTAINER_INCLUDE:-}
      CONTAINER_EXCLUDE: ${CONTAINER_EXCLUDE:-}
      LABEL_INCLUDE: ${LABEL_INCLUDE:-}
      LABEL_EXCLUDE: ${LABEL_EXCLUDE:-}
      LOG_MONITORING_ENABLED: ${LOG_MONITORING_ENABLED:-true}
      NO_DATA_IDLE_SECONDS: ${NO_DATA_IDLE_SECONDS:-600}
      NO_DATA_EXCLUDE: ${NO_DATA_EXCLUDE:-}
      LOG_PATTERN_RATE_LIMITED_ENABLED: ${LOG_PATTERN_RATE_LIMITED_ENABLED:-true}
      LOG_PATTERN_GENERIC_ERROR_ENABLED: ${LOG_PATTERN_GENERIC_ERROR_ENABLED:-false}
      LOG_PATTERNS_FILE: ${LOG_PATTERNS_FILE:-}
      TRAFFIC_BASELINE_WINDOW_SECONDS: ${TRAFFIC_BASELINE_WINDOW_SECONDS:-1800}
      TRAFFIC_SPIKE_MULTIPLIER: ${TRAFFIC_SPIKE_MULTIPLIER:-5}
      TRAFFIC_MIN_BASELINE_SAMPLES: ${TRAFFIC_MIN_BASELINE_SAMPLES:-5}
      TRAFFIC_GRACE_PERIOD_SECONDS: ${TRAFFIC_GRACE_PERIOD_SECONDS:-300}
      TRAFFIC_MIN_RATE_LINES_PER_MIN: ${TRAFFIC_MIN_RATE_LINES_PER_MIN:-2}

      # ---- app phase reporting -------------------------------------------
      # Reads [phase:...] markers out of container logs — see the root
      # README's "Phase reporting" for the convention apps follow.
      PHASE_TRACKING_ENABLED: ${PHASE_TRACKING_ENABLED:-true}
      # A phase older than this is treated as unknown rather than current.
      PHASE_STALE_SECONDS: ${PHASE_STALE_SECONDS:-900}

      # ---- control API ----------------------------------------------------
      API_ENABLED: ${API_ENABLED:-true}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      # Registry of what may be controlled, mounted read-only below.
      # Without it nothing is startable — projects are listed read-only.
      PROJECTS_FILE: ${PROJECTS_FILE:-/config/projects.json}
      LEASES_FILE: ${LEASES_FILE:-/data/leases.json}
      # REQUIRED for restart/update, and for starting anything not marked
      # guest_controllable. Generate one: `openssl rand -hex 32`.
      # Leave it empty and those operations are refused for everyone,
      # which is the safe failure direction but probably not what you want.
      CONTROL_TOKEN: ${CONTROL_TOKEN:-}
      # Only turn this on when something you control terminates connections
      # in front of this and rewrites X-Forwarded-For. With the port
      # exposed directly, a client can forge the header and get a fresh
      # identity per request, defeating the per-IP limits below.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

      # ---- guest limits ----------------------------------------------------
      # How long a visitor's demo runs before it's stopped automatically.
      DEFAULT_TTL_MINUTES: ${DEFAULT_TTL_MINUTES:-60}
      # How many guest-started projects may run at once.
      MAX_CONCURRENT_GUEST_PROJECTS: ${MAX_CONCURRENT_GUEST_PROJECTS:-1}
      # How many compose operations may run in parallel.
      MAX_CONCURRENT_OPERATIONS: ${MAX_CONCURRENT_OPERATIONS:-2}
      # Per-IP: this many control requests per window, and per day.
      # Local/private addresses are exempt from both.
      GUEST_RATE_WINDOW_SECONDS: ${GUEST_RATE_WINDOW_SECONDS:-600}
      GUEST_MAX_REQUESTS_PER_WINDOW: ${GUEST_MAX_REQUESTS_PER_WINDOW:-3}
      GUEST_MAX_REQUESTS_PER_DAY: ${GUEST_MAX_REQUESTS_PER_DAY:-20}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Leases must outlive the container — see docker_monitor/leases.py.
      - monitor-data:/data
      # The registry of controllable projects, and the compose files it
      # points at. BOTH read-only: this process must never be able to
      # rewrite the list of what it's allowed to control, nor the compose
      # files describing how.
      - ${PROJECTS_CONFIG:-./projects.json}:/config/projects.json:ro
      - ${STACKS_DIR:-./stacks}:/stacks:ro
      # NOTE: no /var/run/docker.sock mount. That's the point of the proxy.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ntfy-data:
  monitor-data:
